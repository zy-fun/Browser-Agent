[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "browser-agent"
version = "0.1.0"
description = "A focused text-based browser agent built on BrowserGym."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "browsergym-miniwob==0.14.3",
  "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
llm = ["openai>=1.75,<2"]

[project.scripts]
browser-agent-miniwob = "benchmark.run_miniwob:main"
browser-agent-react = "benchmark.run_react:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "browser", "llm", "benchmark"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
